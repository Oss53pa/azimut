name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Redéployer sans rien changer au code. Sans cela, le seul moyen de relancer
  # un déploiement serait de pousser un commit vide, ce qui salit l'historique
  # pour une raison qui ne le regarde pas.
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Les essais `*.db.test.ts` demandent une base. Sans elle, le pas « RLS
    # tests » s'arrête sur le mode d'emploi de `packages/db/migrations/ORDRE.md`
    # au lieu de prouver quoi que ce soit. Le service la fournit.
    #
    # `trust` plutôt qu'un mot de passe : la base vit le temps du job, n'est
    # jointe que depuis le runner, et un mot de passe écrit ici serait une
    # chaîne de connexion au dépôt, que A2.4 interdit. Il n'y a donc aucun
    # identifiant à écrire.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54332:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # La version vient du champ packageManager de package.json.
        # La redonner ici ferait échouer l'action sur une double
        # spécification.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Visual regression tests
        run: pnpm test:visual

      # Le montage suit `packages/db/migrations/ORDRE.md` mot pour mot, et ses
      # deux points d'attention en sont la raison d'être :
      #
      # `azimut` n'est pas superutilisateur. Un superutilisateur contourne
      # `FORCE ROW LEVEL SECURITY` et toutes les sondes de cloisonnement
      # réussissent en ne prouvant rien — l'erreur commise au premier montage du
      # banc du préalable K4 nº 7.
      #
      # `azimut` est membre de `authenticated`. Les politiques ne s'adressent
      # qu'à ce rôle ; un rôle qui n'en est pas membre ne voit rien, et le
      # cloisonnement passerait pour acquis alors qu'il n'aurait pas été
      # éprouvé.
      #
      # `bootstrap-standalone.sql` passe parce que le service est une base nue,
      # sans schéma `auth` : c'est l'installation autonome que décrit ORDRE.md.
      # L'ordre des migrations est celui, lexicographique, que ce fichier fixe.
      - name: Monter la base d'essai
        run: |
          set -euo pipefail
          psql "postgres://postgres@127.0.0.1:54332/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE azimut LOGIN;
          CREATE ROLE authenticated NOLOGIN;
          GRANT authenticated TO azimut;
          CREATE DATABASE azimut OWNER azimut;
          SQL
          base="postgres://azimut@127.0.0.1:54332/azimut"
          psql "$base" -v ON_ERROR_STOP=1 -q -f packages/db/migrations/bootstrap-standalone.sql
          for f in packages/db/migrations/0*.up.sql; do
            psql "$base" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "Base montée : $(ls packages/db/migrations/0*.up.sql | wc -l) migrations appliquées."

      - name: RLS tests
        env:
          AZIMUT_TEST_DATABASE_URL: postgres://azimut@127.0.0.1:54332/azimut
        run: pnpm test:rls

      - name: Determinism tests
        run: pnpm test:determinism

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  deploy:
    name: Déploiement Cloudflare
    # Rien ne part tant que les quatre commandes de A2.3 et le build ne sont
    # pas passés. C'est tout l'intérêt de tenir le déploiement ici plutôt que
    # dans un workflow à part : l'ordre est garanti par la dépendance, pas
    # espéré.
    needs: ci
    # Jamais depuis une pull request : le code d'une branche en revue n'a rien
    # à faire en production, et une PR venue d'une bifurcation n'aurait de
    # toute façon pas accès aux secrets.
    if: >-
      github.repository == 'Oss53pa/azimut'
      && github.ref == 'refs/heads/master'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Deux déploiements simultanés publieraient dans un ordre indéterminé.
    # `cancel-in-progress: false` : on ne coupe pas une publication en cours,
    # on attend qu'elle finisse.
    concurrency:
      group: deploy-cloudflare-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Un secret vide ne dit pas pourquoi il est vide. La cause la plus
      # fréquente est un rangement dans le mauvais volet : la page « Secrets and
      # variables > Actions » en a deux, et ce qui est déposé sous « Variables »
      # n'alimente jamais `secrets.*`. Ce pas lève ce doute-là, et lui seul.
      #
      # Il ne lit que le contexte `vars`, qui ne porte aucun identifiant, et
      # n'en sort que les noms. Le contexte `secrets` n'est pas lu en bloc : le
      # faire aurait la forme exacte d'une exfiltration, quand bien même on n'en
      # imprimerait que les clés. Les deux secrets attendus restent donc éprouvés
      # un par un, sur leur seule présence.
      - name: Lister les variables du dépôt
        env:
          NOMS_VARIABLES: ${{ toJSON(vars) }}
        run: |
          echo "Variables visibles de ce job, par leur nom :"
          printf '%s' "$NOMS_VARIABLES" \
            | jq -r 'if length == 0 then "  (aucune)" else (keys[] | "  - " + .) end'
          echo
          echo "Un nom attendu qui figure ci-dessus est au mauvais volet : il a"
          echo "été déposé en variable, là où le déploiement attend un secret."

      # Avant toute installation : un secret absent doit se dire ici, en une
      # phrase qui nomme le remède, et non trois minutes plus tard dans une
      # erreur d'authentification de wrangler.
      - name: Vérifier que les secrets sont déclarés
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          manquants=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || manquants="$manquants CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || manquants="$manquants CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets manquants :$manquants — à déclarer dans Settings > Secrets and variables > Actions, volet « Secrets », section « Repository secrets ». Le pas précédent liste les variables du dépôt : un nom manquant qui y figure est au mauvais volet. Absent des deux, il n'a pas été enregistré ici — ou l'a été sous Dependabot, Codespaces, un environnement, ou au niveau de l'organisation sans accès accordé à ce dépôt. Le jeton se crée sur le tableau de bord Cloudflare avec le droit « Edit Cloudflare Workers »."
            exit 1
          fi
          echo "Les deux secrets sont déclarés."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reconstruit plutôt que de transporter le `dist` du job précédent. Un
      # artefact est une pièce mobile de plus, qui peut arriver partielle ou
      # périmée sans le dire ; reconstruire depuis le même commit donne des
      # octets dont on sait d'où ils viennent, et coûte une trentaine de
      # secondes.
      - name: Build
        run: pnpm build

      # `wrangler` n'est pas une dépendance du dépôt : rien d'autre ne
      # l'emploie, et l'ajouter ferait entrer une bibliothèque tierce pour un
      # seul appel (A2.2-4). La contrepartie est assumée : la version n'est pas
      # figée. La figer est un mot à changer ici, le jour où l'on veut la
      # tenir.
      - name: Deploy
        working-directory: apps/studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy
